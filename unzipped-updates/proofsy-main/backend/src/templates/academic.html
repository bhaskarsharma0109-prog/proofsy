<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Source Sans 3',sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#fff}
  .cert{width:1056px;height:746px;border:6px solid #065F46;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;background:#FAFFFE}
  .inner{position:absolute;inset:14px;border:1px solid #A7F3D0}
  .seal{width:80px;height:80px;border:4px solid #065F46;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
  .seal-inner{width:60px;height:60px;border:2px solid #10B981;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'EB Garamond',serif;font-size:20px;font-weight:700;color:#065F46}
  .brand{font-family:'EB Garamond',serif;font-size:14px;color:#065F46;letter-spacing:0.3em;text-transform:uppercase;margin-top:4px}
  .title{font-family:'EB Garamond',serif;font-size:32px;font-weight:700;color:#065F46;margin-top:4px}
  .certify{color:#6B7280;margin-top:28px;font-size:15px;font-weight:300}
  .name-container{margin-top:10px;border-bottom:2px solid #065F46;padding-bottom:6px;overflow:hidden;width:100%;max-width:620px;text-align:center}
  .name{font-family:'EB Garamond',serif;font-weight:700;color:#1F2937;white-space:nowrap;line-height:1}
  .event-label{margin-top:22px;color:#6B7280;font-size:15px;font-weight:300}
  .event-name{font-family:'EB Garamond',serif;font-size:24px;font-weight:600;color:#065F46;margin-top:6px}
  .duration{font-size:13px;color:#6B7280;margin-top:4px;font-weight:300}
  .footer{margin-top:40px;display:flex;justify-content:space-between;align-items:flex-end;width:100%;padding:0 44px}
  .footer-item{text-align:center}
  .footer-item .val{border-top:1px solid #6B7280;padding-top:6px;font-size:13px;color:#1F2937;font-weight:600}
  .footer-item .lbl{font-size:10px;color:#9CA3AF;margin-top:3px;text-transform:uppercase;letter-spacing:0.1em}
  .qr{width:70px;height:70px;border:2px solid #065F46;display:flex;align-items:center;justify-content:center;background:#fff;margin:0 auto 6px;padding:4px}
  .qr img{width:100%;height:100%;object-fit:contain}
  .code{font-family:monospace;font-size:10px;color:#065F46}
</style></head>
<body><div class="cert"><div class="inner"></div>
  <div style="position:relative;z-index:1;text-align:center;width:100%;max-width:700px;display:flex;flex-direction:column;align-items:center">
    <div class="seal"><div class="seal-inner">P</div></div>
    <div class="brand">Proofsy Academy</div>
    <div class="title">Certificate of Achievement</div>
    <p class="certify">This is to certify that</p>
    <div class="name-container"><div class="name" id="recipientName" style="font-size:48px">{{name}}</div></div>
    <p class="event-label">has successfully completed the</p>
    <div class="event-name">{{event}}</div>
    <div class="duration">{{duration}}</div>
    <div class="footer">
      <div class="footer-item"><div class="val">{{date}}</div><div class="lbl">Date</div></div>
      <div class="footer-item"><div class="qr"><img src="{{qrCodeDataUrl}}" alt="Verification QR" /></div><div class="code">{{verificationCode}}</div></div>
      <div class="footer-item"><div class="val">{{organizer}}</div><div class="lbl">Organizer</div></div>
    </div>
  </div>
</div>
<script>(function(){var e=document.getElementById('recipientName'),c=e.parentElement,f=48;e.style.fontSize=f+'px';while(e.scrollWidth>c.clientWidth&&f>16){f--;e.style.fontSize=f+'px'}})()</script>
</body></html>
