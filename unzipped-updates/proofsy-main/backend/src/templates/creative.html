<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#fff}
  .cert{width:1056px;height:746px;position:relative;overflow:hidden;display:flex;background:#fff}
  .sidebar{width:120px;background:linear-gradient(180deg,#7C3AED,#DB2777);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 0}
  .sidebar-text{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);color:rgba(255,255,255,0.7);font-size:12px;letter-spacing:0.3em;text-transform:uppercase;font-weight:300}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 56px;position:relative}
  .accent-circle{position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;background:linear-gradient(135deg,rgba(124,58,237,0.08),rgba(219,39,119,0.08))}
  .brand{font-size:16px;font-weight:800;color:#7C3AED;letter-spacing:0.1em;text-transform:uppercase}
  .title{font-size:12px;color:#A78BFA;text-transform:uppercase;letter-spacing:0.25em;margin-top:4px;font-weight:300}
  .certify{color:#6B7280;margin-top:32px;font-size:14px;font-weight:300}
  .name-container{margin-top:8px;border-bottom:3px solid #7C3AED;padding-bottom:6px;overflow:hidden;width:100%;max-width:600px;text-align:center}
  .name{font-weight:700;color:#1F2937;white-space:nowrap;line-height:1}
  .event-label{margin-top:22px;color:#6B7280;font-size:14px;font-weight:300}
  .event-name{font-size:22px;font-weight:600;color:#7C3AED;margin-top:6px}
  .duration{font-size:12px;color:#A78BFA;margin-top:4px;font-weight:300}
  .footer{margin-top:36px;display:flex;justify-content:space-between;align-items:flex-end;width:100%;padding:0 20px}
  .footer-item{text-align:center}
  .footer-item .val{border-top:2px solid #E5E7EB;padding-top:6px;font-size:12px;color:#1F2937;font-weight:600}
  .footer-item .lbl{font-size:9px;color:#9CA3AF;margin-top:3px;text-transform:uppercase;letter-spacing:0.1em}
  .qr{width:64px;height:64px;border:2px solid #A78BFA;display:flex;align-items:center;justify-content:center;background:#fff;margin:0 auto 6px;padding:4px;border-radius:16px}
  .qr img{width:100%;height:100%;object-fit:contain}
  .code-badge{font-family:monospace;font-size:10px;color:#fff;background:linear-gradient(135deg,#7C3AED,#DB2777);padding:4px 14px;border-radius:20px}
</style></head>
<body><div class="cert">
  <div class="sidebar"><span class="sidebar-text">Certificate of Completion</span></div>
  <div class="main">
    <div class="accent-circle"></div>
    <div style="position:relative;z-index:1;text-align:center;width:100%;max-width:650px">
      <div class="brand">Proofsy</div>
      <div class="title">Certificate of Completion</div>
      <p class="certify">This is to certify that</p>
      <div class="name-container"><div class="name" id="recipientName" style="font-size:46px">{{name}}</div></div>
      <p class="event-label">has successfully completed the</p>
      <div class="event-name">{{event}}</div>
      <div class="duration">{{duration}}</div>
      <div class="footer">
        <div class="footer-item"><div class="val">{{date}}</div><div class="lbl">Date</div></div>
        <div class="footer-item"><div class="qr"><img src="{{qrCodeDataUrl}}" alt="Verification QR" /></div><div class="code-badge">{{verificationCode}}</div></div>
        <div class="footer-item"><div class="val">{{organizer}}</div><div class="lbl">Organizer</div></div>
      </div>
    </div>
  </div>
</div>
<script>(function(){var e=document.getElementById('recipientName'),c=e.parentElement,f=46;e.style.fontSize=f+'px';while(e.scrollWidth>c.clientWidth&&f>16){f--;e.style.fontSize=f+'px'}})()</script>
</body></html>
