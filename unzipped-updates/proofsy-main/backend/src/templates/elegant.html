<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lato:wght@300;400&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Lato',sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#fff}
  .cert{width:1056px;height:746px;border:4px solid #C9A84C;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px;background:linear-gradient(135deg,#FFFEF5,#FFF9E6)}
  .gold-line{position:absolute;inset:16px;border:1px solid #E8D48B}
  .corner{position:absolute;width:60px;height:60px;border:3px solid #C9A84C}
  .corner.tl{top:24px;left:24px;border-right:none;border-bottom:none}
  .corner.tr{top:24px;right:24px;border-left:none;border-bottom:none}
  .corner.bl{bottom:24px;left:24px;border-right:none;border-top:none}
  .corner.br{bottom:24px;right:24px;border-left:none;border-top:none}
  .brand{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;color:#8B6914;letter-spacing:0.08em}
  .subtitle{font-size:13px;color:#B8860B;text-transform:uppercase;letter-spacing:0.25em;margin-top:4px;font-weight:300}
  .certify{color:#888;margin-top:36px;font-size:15px;font-weight:300}
  .name-container{margin-top:10px;border-bottom:2px solid #C9A84C;padding-bottom:6px;overflow:hidden;width:100%;max-width:650px}
  .name{font-family:'Cormorant Garamond',serif;font-weight:700;color:#2C1810;white-space:nowrap;line-height:1}
  .event-label{margin-top:24px;color:#888;font-size:15px;font-weight:300}
  .event-name{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:#8B6914;margin-top:8px}
  .duration{font-size:13px;color:#B8860B;margin-top:4px;font-weight:300}
  .footer{margin-top:44px;display:flex;justify-content:space-between;align-items:flex-end;width:100%;padding:0 48px}
  .footer-item{text-align:center}
  .footer-item .val{border-top:1px solid #C9A84C;padding-top:6px;font-size:13px;color:#2C1810}
  .footer-item .lbl{font-size:10px;color:#B8860B;margin-top:3px;text-transform:uppercase;letter-spacing:0.1em}
  .qr{width:65px;height:65px;border:2px solid #C9A84C;display:flex;align-items:center;justify-content:center;background:#FFFEF5;margin:0 auto 6px;padding:4px}
  .qr img{width:100%;height:100%;object-fit:contain}
  .code{font-family:monospace;font-size:10px;color:#8B6914}
</style></head>
<body><div class="cert"><div class="gold-line"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div style="position:relative;z-index:1;text-align:center;width:100%;max-width:700px">
    <div class="brand">Certificate of Excellence</div>
    <div class="subtitle">Presented with honor</div>
    <p class="certify">This is to certify that</p>
    <div class="name-container"><div class="name" id="recipientName" style="font-size:50px">{{name}}</div></div>
    <p class="event-label">has successfully completed the</p>
    <div class="event-name">{{event}}</div>
    <div class="duration">{{duration}}</div>
    <div class="footer">
      <div class="footer-item"><div class="val">{{date}}</div><div class="lbl">Date</div></div>
      <div class="footer-item"><div class="qr"><img src="{{qrCodeDataUrl}}" alt="Verification QR" /></div><div class="code">{{verificationCode}}</div></div>
      <div class="footer-item"><div class="val">{{organizer}}</div><div class="lbl">Organizer</div></div>
    </div>
  </div>
</div>
<script>(function(){var e=document.getElementById('recipientName'),c=e.parentElement,f=50;e.style.fontSize=f+'px';while(e.scrollWidth>c.clientWidth&&f>16){f--;e.style.fontSize=f+'px'}})()</script>
</body></html>
