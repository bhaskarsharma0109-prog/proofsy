# DigitalOcean App Platform Spec
# Deploy via: doctl apps create --spec .do/app.yaml
# Or import via the DigitalOcean dashboard

name: proofsy

databases:
  - engine: MONGODB
    name: proofsy-db
    production: true
    version: "7"
  - engine: REDIS
    name: proofsy-redis
    production: true
    version: "7"

services:
  # ── Backend API ──
  - name: backend
    github:
      repo: bhaskar1461/proofsy
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 5000
    instance_count: 1
    instance_size_slug: basic-s
    routes:
      - path: /api
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        scope: RUN_TIME
        value: ${proofsy-db.CONNECTION_STRING}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${proofsy-redis.CONNECTION_STRING}
      - key: CORS_ORIGIN
        value: ${APP_URL}
      - key: FRONTEND_BASE_URL
        value: ${APP_URL}
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/google-chrome-stable

  # ── Frontend ──
  - name: frontend
    github:
      repo: bhaskar1461/proofsy
      branch: main
      deploy_on_push: true
    source_dir: frontend
    dockerfile_path: frontend/Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-s
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        value: ${APP_URL}

workers:
  # ── Background Certificate Worker ──
  - name: worker
    github:
      repo: bhaskar1461/proofsy
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    instance_count: 1
    instance_size_slug: basic-s
    envs:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        scope: RUN_TIME
        value: ${proofsy-db.CONNECTION_STRING}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${proofsy-redis.CONNECTION_STRING}
      - key: FRONTEND_BASE_URL
        value: ${APP_URL}
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/google-chrome-stable
    run_command: node src/worker.js
