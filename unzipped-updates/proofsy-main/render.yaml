# Render Blueprint — auto-configures the backend service
services:
  - type: web
    name: proofsy-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    rootDir: backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false  # You'll set this manually from MongoDB Atlas
      - key: REDIS_URL
        sync: false  # You'll set this manually from Upstash
      - key: FRONTEND_BASE_URL
        sync: false  # You'll set this after Vercel deploys
      - key: CORS_ORIGIN
        sync: false
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/google-chrome-stable
    healthCheckPath: /api/health
